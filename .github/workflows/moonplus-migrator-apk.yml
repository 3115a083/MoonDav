name: Moon+ Migrator APK

on:
  push:
    branches:
      - build/moonplus-migrator-android
    paths:
      - 'tools/moonplus-migrator/**'
      - '.github/workflows/moonplus-migrator-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/moonplus-migrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MoonPlusMigrator-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MoonPlusMigrator-1.0.0
          path: tools/moonplus-migrator/MoonPlusMigrator-1.0.0.apk
          if-no-files-found: error
