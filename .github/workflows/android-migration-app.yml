name: Build Moon Migration Android app

on:
  push:
    branches:
      - build/moon-migration-app

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat .build/moonchunk_aa .build/moonchunk_ab .build/moonchunk_ac .build/moonchunk_ad .build/moonchunk_ae .build/moonchunk_af \
            | base64 -d > /tmp/MoonMigration-src.zip
          unzip -t /tmp/MoonMigration-src.zip
          unzip -q /tmp/MoonMigration-src.zip -d /tmp/src

      - name: Apply compile and network hardening fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          import re

          resolver = Path("/tmp/src/MoonMigration/app/src/main/java/dev/moonmigration/app/EpubPositionResolver.kt")
          r = resolver.read_text()
          r = r.replace("import javax.xml.XMLConstants\n", "")
          r = r.replace('setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD, "")', 'setAttribute("http://javax.xml.XMLConstants/property/accessExternalDTD", "")')
          r = r.replace('setAttribute(XMLConstants.ACCESS_EXTERNAL_SCHEMA, "")', 'setAttribute("http://javax.xml.XMLConstants/property/accessExternalSchema", "")')
          resolver.write_text(r)

          kosync = Path("/tmp/src/MoonMigration/app/src/main/java/dev/moonmigration/app/KoSyncClient.kt")
          k = kosync.read_text()
          k = k.replace("    private fun validateBaseUrl(raw: String, allowLan: Boolean, allowHttpLan: Boolean): URI {", "    internal fun validateBaseUrl(raw: String, allowLan: Boolean, allowHttpLan: Boolean): URI {")
          k = k.replace('require(scheme == "https" || (scheme == "http" && allowLan && allowHttpLan)) { "HTTPS required" }', 'require(scheme == "https" || scheme == "http") { "HTTPS required" }')
          if "Unencrypted HTTP is allowed only for explicitly enabled private LAN targets" not in k:
              marker = "        val normalized ="
              if marker not in k:
                  raise SystemExit("Expected KOSync URL normalization marker not found")
              insert = '        if (scheme == "http") {\n            require(allowLan && allowHttpLan && addresses.all(::isPrivate)) {\n                "Unencrypted HTTP is allowed only for explicitly enabled private LAN targets"\n            }\n        }\n'
              k = k.replace(marker, insert + marker, 1)
          kosync.write_text(k)

          test = Path("/tmp/src/MoonMigration/app/src/test/java/dev/moonmigration/app/UtilityTest.kt")
          t = test.read_text()
          if "allowsExplicitPrivateLanHttpOnly" not in t:
              extra = '\n    @Test fun allowsExplicitPrivateLanHttpOnly() {\n        val uri = KoSyncClient.validateBaseUrl("http://192.168.1.20:8080", allowLan = true, allowHttpLan = true)\n        assertEquals("http", uri.scheme)\n    }\n\n    @Test(expected = IllegalArgumentException::class)\n    fun rejectsPublicHttpEvenWhenLanHttpEnabled() {\n        KoSyncClient.validateBaseUrl("http://8.8.8.8", allowLan = true, allowHttpLan = true)\n    }\n\n    @Test(expected = IllegalArgumentException::class)\n    fun rejectsPrivateLanWithoutOptIn() {\n        KoSyncClient.validateBaseUrl("https://192.168.1.20", allowLan = false, allowHttpLan = false)\n    }\n\n    @Test(expected = IllegalArgumentException::class)\n    fun rejectsUrlUserInfo() {\n        KoSyncClient.validateBaseUrl("https://user:secret@8.8.8.8", allowLan = false, allowHttpLan = false)\n    }\n'
              i = t.rfind("}")
              test.write_text(t[:i] + extra + t[i:])
          PYFIX

          cd /tmp/src
          rm -f /tmp/MoonMigration-src.zip
          zip -qr /tmp/MoonMigration-src.zip MoonMigration -x '*/build/*' '*/.gradle/*' '*/.DS_Store'
          unzip -t /tmp/MoonMigration-src.zip >/dev/null

      - name: Source privacy and secret audit
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/src/MoonMigration
          if grep -RInE --exclude-dir=build --exclude-dir=.gradle \
            '(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----|AIza[0-9A-Za-z_-]{30,})' "$SRC"; then
            echo "Potential embedded secret detected" >&2
            exit 1
          fi
          if grep -RInE --include='*.kt' --include='*.xml' --include='*.kts' --include='*.properties' \
            '(Bearer [A-Za-z0-9._~+/-]{16,}|Basic [A-Za-z0-9+/=]{16,})' "$SRC"; then
            echo "Potential embedded credential detected" >&2
            exit 1
          fi
          test "$(grep -RIl 'Synthetic annotation data\|Example Book\|Synthetic Author' "$SRC/app/src/test" | wc -l)" -ge 1
          ! grep -RInE --exclude-dir=build --exclude-dir=.gradle '/home/|/Users/|content://|file://' "$SRC"
          test -z "$(find "$SRC" -type f \( -name '*.po' -o -name '*.an' -o -name '*.mrexpt' -o -name '*.mrpro' \) -print -quit)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: /tmp/src/MoonMigration
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        working-directory: /tmp/src/MoonMigration
        run: gradle --no-daemon lintRelease

      - name: Build release APK
        working-directory: /tmp/src/MoonMigration
        run: gradle --no-daemon assembleRelease

      - name: Sign release with ephemeral build key
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -keystore /tmp/release.jks -storepass "$PASS" -keypass "$PASS" -alias app \
            -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Moon Migration Build,O=Local Build,C=DE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/release.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out /tmp/MoonMigration-1.1.0.apk /tmp/src/MoonMigration/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/MoonMigration-1.1.0.apk | tee /tmp/apksigner.txt
          sha256sum /tmp/MoonMigration-1.1.0.apk | tee /tmp/MoonMigration-1.1.0.sha256
          rm -f /tmp/release.jks

      - name: Manifest and permission audit
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$AAPT" dump badging /tmp/MoonMigration-1.1.0.apk | tee /tmp/badging.txt
          "$AAPT" dump permissions /tmp/MoonMigration-1.1.0.apk | tee /tmp/permissions.txt
          grep -q "package: name='dev.moonmigration.app'" /tmp/badging.txt
          grep -q "uses-permission: name='android.permission.INTERNET'" /tmp/permissions.txt
          test "$(grep -c "uses-permission:" /tmp/permissions.txt)" -le 2
          grep -q "uses-permission: name='dev.moonmigration.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'" /tmp/permissions.txt
          unzip -p /tmp/MoonMigration-1.1.0.apk AndroidManifest.xml > /tmp/AndroidManifest.bin
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print /tmp/MoonMigration-1.1.0.apk > /tmp/manifest.xml
          grep -q 'android:allowBackup="false"' /tmp/manifest.xml
          grep -q 'android:usesCleartextTraffic="false"' /tmp/manifest.xml
          test "$(grep -c 'android:exported="true"' /tmp/manifest.xml)" -eq 1
          ! grep -Eq '<service[^>]+android:exported="true"|<receiver[^>]+android:exported="true"|<provider[^>]+android:exported="true"' /tmp/manifest.xml

      - name: APK privacy and secret audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/apk-unpacked
          mkdir /tmp/apk-unpacked
          unzip -q /tmp/MoonMigration-1.1.0.apk -d /tmp/apk-unpacked
          find /tmp/apk-unpacked -type f -size -32M -print0 | xargs -0 strings -a > /tmp/apk-strings.txt
          if grep -E '(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----|AIza[0-9A-Za-z_-]{30,})' /tmp/apk-strings.txt; then
            echo "Potential secret found in APK" >&2
            exit 1
          fi
          ! grep -E '/home/|/Users/|content://|file://' /tmp/apk-strings.txt
          grep -q 'Example Book' /tmp/src/MoonMigration/app/src/test/java/dev/moonmigration/app/UtilityTest.kt

      - name: Build audit report
        shell: bash
        run: |
          cat > /tmp/MoonMigration-audit.txt <<REPORT
          Moon Migration 1.1.0 build audit
          - Source ZIP reconstruction: PASS
          - Source secret/privacy scan: PASS
          - Unit tests: PASS
          - Android lint: PASS
          - Release build: PASS
          - APK signing verification: PASS
          - Manifest/permission audit: PASS
          - APK secret/privacy scan: PASS
          - INTERNET is the only requested permission and is used solely for explicit KOReader/KOSync upload.
          - HTTPS is required by default. Optional cleartext HTTP is restricted to explicitly enabled private LAN targets.
          - Android backup disabled and cleartext traffic disabled by default.
          - No analytics, telemetry, ads, WebView, services, receivers, or exported providers.
          REPORT

      - uses: actions/upload-artifact@v4
        with:
          name: MoonMigration-1.1.0
          path: |
            /tmp/MoonMigration-1.1.0.apk
            /tmp/MoonMigration-src.zip
            /tmp/MoonMigration-1.1.0.sha256
            /tmp/MoonMigration-audit.txt
            /tmp/apksigner.txt
            /tmp/permissions.txt
            /tmp/manifest.xml
          if-no-files-found: error
          retention-days: 7
