services:
  moondav:
    image: ghcr.io/3115a083/moondav:beta
    container_name: moondav
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MOONDAV_DAV_PASSWORD_FILE: /run/secrets/dav_password
      MOONDAV_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      # Enable only the secret required by your backend:
      # MOONDAV_BACKEND_TOKEN_FILE: /run/secrets/backend_token
      # MOONDAV_BACKEND_PASSWORD_FILE: /run/secrets/backend_password
      # MOONDAV_SHELF_PASSWORD_FILE: /run/secrets/shelf_password
      # MOONDAV_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      # MOONDAV_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      # MOONDAV_WEBHOOK_BEARER_FILE: /run/secrets/webhook_bearer
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - moondav-data:/data
    secrets:
      - dav_password
      - admin_password
      # - backend_token
      # - backend_password
      # - shelf_password
      # - telegram_bot_token
      # - smtp_password
      # - webhook_bearer
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    pids_limit: 128
    mem_limit: 128m

volumes:
  moondav-data:

secrets:
  dav_password:
    file: ./secrets/dav_password
  admin_password:
    file: ./secrets/admin_password
  # backend_token:
  #   file: ./secrets/backend_token
  # backend_password:
  #   file: ./secrets/backend_password
  # shelf_password:
  #   file: ./secrets/shelf_password
  # telegram_bot_token:
  #   file: ./secrets/telegram_bot_token
  # smtp_password:
  #   file: ./secrets/smtp_password
  # webhook_bearer:
  #   file: ./secrets/webhook_bearer
